<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body data-page="archive" data-tagline="Le fonds : tout ce qui a été dit, conservé">
  <header id="masthead"></header>

  <div class="wrap" style="padding-top:var(--s6);padding-bottom:var(--s8)">
    <p class="dek" style="max-width:44rem;margin-top:0">
      La matière première de l’observatoire&nbsp;: tout ce que publient les comptes suivis, et
      tous les articles où une figure parle ou se trouve citée. Rien n’est trié à l’entrée —
      c’est le fonds complet qui rend une comparaison honnête. Les analyses se lisent
      <a class="source-link" href="sujets.html">côté sujets</a>.
    </p>

    <div class="band" style="margin-top:var(--s6)">
      <div class="filters" id="sourceTabs" role="group" aria-label="Source"></div>
      <span class="spacer"></span>
      <p id="count"></p>
    </div>

    <div class="controls" style="padding-left:0;padding-right:0;margin-top:var(--s4)">
      <div class="filters" id="f1" role="group"></div>
      <div class="filters" id="f2" role="group"></div>
      <div class="spacer"></div>
      <label class="sr-only" for="q">Filtrer</label>
      <input id="q" class="field" type="search" style="max-width:20rem" placeholder="Filtrer…" />
    </div>

    <div class="register" id="list"></div>
    <p class="state" id="sentinel"></p>
  </div>

  <!-- Lecteur : panneau latéral, ouvert au clic sur un article de presse -->
  <div class="reader" id="reader" hidden>
    <div class="reader__scrim" id="readerBackdrop"></div>
    <aside class="reader__panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <div class="reader__bar">
        <p class="stamp" id="readerMeta"></p>
        <div class="spacer"></div>
        <button class="reader__close" id="readerClose" aria-label="Fermer le lecteur">&times;</button>
      </div>
      <article class="reader__body">
        <h1 id="readerTitle"></h1>
        <p class="stamp" id="readerSub" style="margin-top:var(--s3)"></p>
        <div class="entry__foot" id="readerPeople"></div>
        <div class="reader__text" id="readerBody"></div>
        <div class="entry__foot" id="readerFoot" style="margin-top:var(--s6)"></div>
      </article>
    </aside>
  </div>

  <script src="common.js"></script>
  <script src="archive.js"></script>
</body>
</html>
