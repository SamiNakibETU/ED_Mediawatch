<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Compteur — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body data-page="compteur" data-tagline="Valeurs annoncées, par référent">
  <header id="masthead"></header>

  <div class="layout">
    <aside class="rail">
      <p class="rail__title">Référents</p>
      <div class="referents" id="list"></div>
    </aside>
    <main>
      <h1 id="title">Sélectionne un référent</h1>
      <p class="lede" id="sub">Chaque point est une valeur chiffrée annoncée publiquement, datée et attribuée. L’écart entre les points est ce qui se discute.</p>
      <div id="chart"></div>
      <p class="section-label" style="margin-top:var(--s6)">Relevé</p>
      <div class="register" id="points"></div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="compteur.js"></script>
</body>
</html>
