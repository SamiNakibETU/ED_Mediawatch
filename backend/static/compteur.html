<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Compteur — ED Mediawatch</title>
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="compteur" data-tagline="Valeurs annoncées, par référent">
  <header id="masthead"></header>

  <div class="layout">
    <aside class="rail">
      <p class="rail__title">Référents</p>
      <div class="referents" id="list"></div>
    </aside>
    <main>
      <p class="dek lede-first">Les valeurs chiffrées annoncées sur un même objet, datées et attribuées. L’intérêt n’est pas la valeur, c’est l’<strong>écart</strong>.</p>
      <div id="stats-bar" class="mb-7"></div>
      <h1 id="title">Sélectionne un référent</h1>
      <p class="lede" id="sub">Chaque point est une valeur chiffrée annoncée publiquement, datée et attribuée. L’écart entre les points est ce qui se discute.</p>
      <div id="chart" class="card mt-5"></div>
      <p class="section-label mt-7">Relevé</p>
      <div class="card"><div class="register" id="points"></div></div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="compteur.js"></script>
</body>
</html>
