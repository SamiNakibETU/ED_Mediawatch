<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validation — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="validation" data-tagline="Rien ne se publie sans relecture">
  <header id="masthead"></header>

  <div class="controls">
    <div class="filters" id="typeFilters" role="group" aria-label="Type d’incohérence"></div>
  </div>

  <div class="wrap page">
    <main>
      <p class="dek measure lede-first">
        Chaque rapprochement ci-dessous est une <em>proposition</em> de la machine. Il n’existe
        pas tant qu’un humain ne l’a pas confirmé&nbsp;: vérifie la source des deux côtés avant
        de trancher. C’est ici, et seulement ici, qu’un propos devient publiable.</p>
      <div id="stats-bar" class="mt-5"></div>
      <div class="band"><h2>File de relecture</h2><span class="spacer"></span>
        <p id="scopeNote"></p></div>
      <div class="verdicts" id="list"></div>
      <p class="state" id="empty" hidden></p>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="contradictions.js"></script>
</body>
</html>
