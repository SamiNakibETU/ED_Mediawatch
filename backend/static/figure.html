<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figures — ED Mediawatch</title>
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="figures" data-tagline="Qui défend quoi, et depuis quand">
  <header id="masthead"></header>

  <div class="layout">
    <aside class="rail">
      <p class="rail__title">Figures suivies</p>
      <label class="sr-only" for="figSearch">Chercher une figure</label>
      <input id="figSearch" class="field mb-3" type="search" placeholder="Chercher…" />
      <div class="referents" id="figList"></div>
    </aside>
    <main id="detail">
      <p class="state">Sélectionne une figure.</p>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="figure.js"></script>
</body>
</html>
