<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réseaux sociaux — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    // Avant peinture : évite le flash de thème.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="feed" data-tagline="Registre des prises de parole">
  <header id="masthead"></header>

  <div class="controls">
    <div class="filters" id="groupFilters" role="group" aria-label="Famille politique"></div>
    <div class="spacer"></div>
    <label class="switch"><input id="hideRT" type="checkbox" /> Masquer les retweets</label>
  </div>
  <div class="controls">
    <label class="sr-only" for="search">Filtrer une personnalité</label>
    <input id="search" class="field" type="search" placeholder="Filtrer une personnalité (nom ou @handle)…" />
  </div>

  <div class="layout">
    <aside class="rail">
      <p class="rail__title">Thèmes</p>
      <nav class="tree" id="themeTree" aria-label="Filtrer par thème"></nav>
    </aside>
    <main>
      <div class="register" id="feed"></div>
      <p class="state" id="sentinel"></p>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
