<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aujourd’hui — ED Mediawatch</title>
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="accueil" data-tagline="Ce qui compte, et pourquoi">
  <header id="masthead"></header>
  <div class="wrap page">
    <!-- Un seul chemin : ce qui compte cette semaine, puis le sujet, puis la
         source. La une ne montre ni « le plus récent » ni « le plus aimé » :
         elle montre l'inhabituel, le repris, le contredit, l'engageant — et
         dit lequel, à côté de chaque ligne. -->
    <div class="band band--flush"><h2>Ce qui compte cette semaine</h2>
      <span class="spacer"></span>
      <p id="pourquoi-note">Classé par ce qui est inhabituel, repris, contredit ou engageant.</p></div>
    <!-- Deux colonnes : la parole à gauche, à la mesure de lecture ; ce qu'on
         en a écrit à droite. Le corps de texte gardait sa juste largeur mais
         laissait la moitié droite de l'écran vide, et la revue de la semaine —
         le seul travail éditorial du produit — était reléguée sous la ligne de
         flottaison. -->
    <div class="une">
      <main id="aujourdhui"><p class="state">Chargement…</p></main>
      <aside id="revue" class="une__cote" hidden></aside>
    </div>

    <div class="band"><h2>Les sujets qui bougent</h2>
      <span class="spacer"></span>
      <p>Où plusieurs voix se répondent, le plus fort d’abord.</p></div>
    <div class="tiles" id="grid"></div>
  </div>

  <script src="common.js"></script>
  <script src="accueil.js"></script>
</body>
</html>
