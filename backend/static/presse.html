<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presse — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="presse" data-tagline="Revue de presse">
  <header id="masthead"></header>

  <div class="controls">
    <div class="filters" id="natureFilters" role="group" aria-label="Nature de l’article"></div>
    <div class="spacer"></div>
    <div class="filters" id="leaningFilters" role="group" aria-label="Orientation du média"></div>
  </div>

  <div class="layout">
    <aside class="rail">
      <p class="rail__title">Thèmes</p>
      <nav class="tree" id="themeTree" aria-label="Filtrer par thème"></nav>
    </aside>
    <main>
      <div class="register" id="list"></div>
      <p class="state" id="sentinel"></p>
    </main>
  </div>

  <!-- Lecteur : panneau latéral, ouvert au clic sur un article -->
  <div class="reader" id="reader" hidden>
    <div class="reader__scrim" id="readerBackdrop"></div>
    <aside class="reader__panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <div class="reader__bar">
        <p class="stamp" id="readerMeta"></p>
        <div class="spacer"></div>
        <button class="reader__close" id="readerClose" aria-label="Fermer le lecteur">&times;</button>
      </div>
      <article class="reader__body">
        <h1 id="readerTitle"></h1>
        <p class="stamp" id="readerSub" style="margin-top:var(--s3)"></p>
        <div class="entry__foot" id="readerPeople"></div>
        <div class="reader__text" id="readerBody"></div>
        <div class="entry__foot" id="readerFoot" style="margin-top:var(--s6)"></div>
      </article>
    </aside>
  </div>

  <script src="common.js"></script>
  <script src="presse.js"></script>
</body>
</html>
