<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujets — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body data-page="sujets" data-tagline="Ce dont ils parlent, et qui dit quoi">
  <header id="masthead"></header>

  <div class="wrap" style="padding-top:var(--s6);padding-bottom:var(--s8)">
    <p class="dek" style="max-width:44rem;margin-top:0">
      Un sujet est un objet de débat précis — « la hausse des impôts », pas « économie ».
      Les <strong>exploitables</strong> viennent en tête&nbsp;: plusieurs voix s’y expriment et ils
      courent sur la durée. C’est là qu’une confrontation ou un revirement peut exister.
    </p>

    <div class="controls" style="padding-left:0;padding-right:0;margin-top:var(--s6)">
      <div class="filters" id="scope" role="group" aria-label="Portée"></div>
      <div class="spacer"></div>
      <label class="sr-only" for="q">Chercher un sujet</label>
      <input id="q" class="field" type="search" style="max-width:22rem" placeholder="Chercher un sujet…" />
    </div>

    <div class="filters" id="themes" style="margin-top:var(--s3)"></div>

    <div class="band" style="margin-top:var(--s6)"><h2 id="bandTitle">Sujets</h2>
      <span class="spacer"></span><p id="count"></p></div>
    <div id="list"></div>
    <p class="state" id="sentinel"></p>
  </div>

  <script src="common.js"></script>
  <script src="sujets.js"></script>
</body>
</html>
