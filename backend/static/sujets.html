<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujets — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="sujets" data-tagline="Objets de débat">
  <header id="masthead"></header>

  <div class="controls">
    <label class="sr-only" for="search">Chercher un sujet</label>
    <input id="search" class="field" type="search" placeholder="Chercher un sujet…" style="max-width:24rem" />
    <label class="switch"><input id="onlyConfrontable" type="checkbox" checked /> Sujets à plusieurs voix</label>
    <div class="spacer"></div>
    <div class="filters" id="themeFilters" role="group" aria-label="Thème"></div>
  </div>

  <div class="layout" style="grid-template-columns:1fr">
    <main>
      <p class="lede">Le corpus vu par objet de débat, pas par auteur. Un sujet
        n’est exploitable que si plusieurs voix s’y expriment et qu’il court sur
        la durée — c’est là qu’une évolution de position peut se lire.</p>
      <div id="list"></div>
      <p class="state" id="empty" hidden></p>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="sujets.js"></script>
</body>
</html>
