<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujets — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="sujets" data-tagline="Ce dont ils parlent, et qui dit quoi">
  <header id="masthead"></header>

  <div class="wrap page">
    <p class="dek measure lede-first">
      Un sujet est un objet de débat précis — « la hausse des impôts », pas « économie ».
      Les <strong>exploitables</strong> viennent en tête&nbsp;: plusieurs voix s’y expriment et ils
      courent sur la durée. C’est là qu’une confrontation ou un revirement peut exister.
    </p>

    <div class="controls flush mt-6">
      <div class="filters" id="scope" role="group" aria-label="Portée"></div>
      <div class="spacer"></div>
      <label class="sr-only" for="q">Chercher un sujet</label>
      <input id="q" class="field field--inline" type="search" placeholder="Chercher un sujet…" />
    </div>

    <div class="filters mt-3" id="themes"></div>

    <div class="band" class="mt-6"><h2 id="bandTitle">Sujets</h2>
      <span class="spacer"></span><p id="count"></p></div>
    <div id="list"></div>
    <p class="state" id="sentinel"></p>
  </div>

  <script src="common.js"></script>
  <script src="sujets.js"></script>
</body>
</html>
