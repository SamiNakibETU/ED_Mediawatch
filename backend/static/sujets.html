<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujets — ED Mediawatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="design.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-page="sujets" data-tagline="Ce dont ils parlent, et qui dit quoi">
  <header id="masthead"></header>

  <div class="controls">
    <div class="filters" id="scopeFilters" role="group" aria-label="Portée"></div>
    <div class="spacer"></div>
    <label class="sr-only" for="subjSearch">Chercher un sujet</label>
    <input id="subjSearch" class="field" type="search" placeholder="Chercher un sujet…" style="max-width:22rem" />
  </div>

  <div class="layout" style="grid-template-columns:1fr">
    <main>
      <p class="lede">Un sujet est un objet de débat précis — « la hausse des impôts », pas « économie ».
        Les sujets <strong>exploitables</strong> viennent en tête : plusieurs voix s’y expriment et ils courent
        sur la durée. C’est là qu’une confrontation ou un revirement peut exister.</p>
      <div id="list"></div>
      <p class="state" id="sentinel"></p>
    </main>
  </div>

  <!-- Panneau de lecture d'un sujet : qui dit quoi, dans le temps -->
  <div class="reader" id="reader" hidden>
    <div class="reader__scrim" id="readerBackdrop"></div>
    <aside class="reader__panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <div class="reader__bar">
        <p class="stamp" id="readerMeta"></p>
        <div class="spacer"></div>
        <button class="reader__close" id="readerClose" aria-label="Fermer">&times;</button>
      </div>
      <article class="reader__body">
        <h1 id="readerTitle"></h1>
        <p class="lede" id="readerSub" style="margin-top:var(--s3)"></p>
        <div id="readerBody"></div>
      </article>
    </aside>
  </div>

  <script src="common.js"></script>
  <script src="sujets.js"></script>
</body>
</html>
